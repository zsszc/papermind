appId: com.papermind.app
productName: PaperMind
copyright: Copyright © 2026 PaperMind
directories:
  output: ../frontend/out
  buildResources: build
files:
  - main.js
  - preload.js
  - backend-lifecycle.js
  - security-policy.js
extraResources:
  - from: ../frontend/dist
    to: frontend/dist
  - from: runtime/backend
    to: backend
    filter:
      - "**/*"
      - "!.pytest_cache{,/**/*}"
      - "!**/__pycache__{,/**/*}"
      - "!**/*.pyc"
      - "!**/.DS_Store"
  - from: ../config.yaml.example
    to: config.yaml.example
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
linux:
  target:
    - AppImage
    - deb
