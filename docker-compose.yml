# PaperMind 一键部署（Docker Compose）
#
# 使用：
#   1. 首次：cp config.yaml.example config.yaml 并填入 Kimi API Key
#   2. docker compose up -d --build
#   3. 访问 http://localhost:8000/api/health 验证
#
# 说明：
#   - 仅包含 backend 单服务，保持简单；前端开发期请在宿主机运行
#     `cd frontend && npm run dev`（:5173，自动代理 /api 与 /static 到 8000）。
#   - 所有数据目录绑定挂载到宿主机项目根，容器删除后数据保留。
#   - config.yaml 以只读方式挂载，密钥不进入镜像。
#   - HuggingFace 缓存挂载避免 BGE-M3（约 2GB）重复下载；
#     HF_ENDPOINT 指向国内镜像站，首次启动需联网下载模型。

services:
  backend:
    build: .
    container_name: papermind-backend
    ports:
      - "8000:8000"
    environment:
      # BGE-M3 首次启动在线下载，走 hf-mirror.com 镜像站
      HF_ENDPOINT: https://hf-mirror.com
    volumes:
      # 配置文件（只读，含 API Key，不 baked 进镜像）
      - ./config.yaml:/app/config.yaml:ro
      # 数据目录持久化（绑定挂载到宿主机项目根）
      - ./data:/app/data
      - ./papers:/app/papers
      - ./notes:/app/notes
      - ./summaries:/app/summaries
      - ./my-thesis:/app/my-thesis
      - ./vector_db:/app/vector_db
      - ./logs:/app/logs
      - ./backups:/app/backups
      # HuggingFace 模型缓存（BGE-M3 约 2GB，避免容器重建后重复下载）
      - ~/.cache/huggingface:/root/.cache/huggingface
    restart: unless-stopped
