# PaperMind 持续集成（CI）
#
# 触发条件：push 或 Pull Request 目标分支为 main。
# 包含三个并行 job：
#   - backend ：Python 3.12，安装后端依赖并运行 pytest
#   - frontend：Node 20，npm ci 后执行 test、lint 与 build
#   - electron：Node 20，跳过二进制下载后执行 node:test 与语法检查
# pip / npm 均开启缓存以加速后续构建。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12（启用 pip 缓存）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        # 注意：requirements.txt 中 httpx 固定为 0.27.2，
        # 与 openai 1.12 兼容，请勿升级 httpx >= 0.28
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pydantic-settings

      - name: 运行 pytest
        working-directory: backend
        env:
          # 置空 PYTHONPATH，避免 runner 环境污染导入路径
          PYTHONPATH: ""
        run: python -m pytest tests/ -q

  frontend:
    name: 前端检查（lint + build）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20（启用 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（npm ci，严格按 lockfile）
        working-directory: frontend
        run: npm ci

      - name: ESLint 检查（零警告）
        working-directory: frontend
        run: npm run lint

      - name: 前端单元/组件测试
        working-directory: frontend
        run: npm test

      - name: 构建产物（vite build）
        working-directory: frontend
        run: npm run build

  electron:
    name: Electron 生命周期 Harness
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20（启用 npm 缓存）
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: 安装锁定依赖（跳过 Electron 二进制下载）
        working-directory: electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts

      - name: 运行生命周期测试
        working-directory: electron
        run: npm test

      - name: 主进程语法检查
        working-directory: electron
        run: |
          node --check main.js
          node --check backend-lifecycle.js
