# PaperMind 公开可复现检索评测
#
# PR/push 自动运行，也可在 GitHub Actions 页面手动触发。
# 使用仓库内原创 CC0 合成语料、稳定 evidence qrels 和内存 SQLite，
# 不加载 Embedding 模型、不调用 LLM、不接触私人论文或运行时数据库。
# 评测报告（backend/eval/reports/）会作为 artifact 上传，便于下载查看。

name: Eval

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/eval/**"
      - "backend/tests/test_eval_*.py"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
    paths:
      - "backend/eval/**"
      - "backend/tests/test_eval_*.py"
      - ".github/workflows/eval.yml"

jobs:
  retrieval-eval:
    name: 检索质量评测（无 LLM）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12（启用 pip 缓存）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行评测 Harness 测试
        working-directory: backend
        env:
          PYTHONPATH: ""
        run: python -m pytest tests/test_eval_*.py tests/test_dataset.py -q

      - name: 运行 count 兼容基线
        working-directory: backend
        env:
          PYTHONPATH: ""
        run: >-
          python -m eval.run
          --fixture eval/fixtures/rag_public_v1.json
          --dataset eval/dataset/qa_public_v1.jsonl
          --keyword-only
          --lexical-profile count
          --threshold 0.85
          --report-dir eval/reports/public-count

      - name: 运行 BM25 候选基线
        working-directory: backend
        env:
          PYTHONPATH: ""
        run: >-
          python -m eval.run
          --fixture eval/fixtures/rag_public_v1.json
          --dataset eval/dataset/qa_public_v1.jsonl
          --keyword-only
          --lexical-profile bm25
          --threshold 0.85
          --report-dir eval/reports/public-bm25

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: backend/eval/reports/
          if-no-files-found: warn
          retention-days: 30
