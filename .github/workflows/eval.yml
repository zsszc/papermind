# PaperMind 检索评测（可选，手动触发）
#
# 触发方式：GitHub 页面 Actions → Eval → Run workflow（workflow_dispatch）。
# 评测内容：python -m eval.run（纯检索质量评测，不调用 LLM，无需 API Key）。
# 评测报告（backend/eval/reports/）会作为 artifact 上传，便于下载查看。

name: Eval

on:
  workflow_dispatch:

jobs:
  retrieval-eval:
    name: 检索质量评测（无 LLM）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12（启用 pip 缓存）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 运行检索评测
        working-directory: backend
        env:
          # 置空 PYTHONPATH，确保 eval 包从 backend/ 解析
          PYTHONPATH: ""
          # Embedding 模型走镜像站，避免 huggingface.co 直连超时
          HF_ENDPOINT: https://hf-mirror.com
        run: python -m eval.run

      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: backend/eval/reports/
          if-no-files-found: warn
          retention-days: 30
