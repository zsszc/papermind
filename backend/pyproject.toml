[project]
name = "papermind-backend"
version = "1.1.0"
description = "PaperMind 本地文献知识库后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.0",
    "pydantic==2.6.0",
    "pydantic-settings>=2.2",
    "python-multipart==0.0.9",
    "python-docx==1.1.0",
    "pdfplumber==0.10.0",
    "pypdf2==3.0.1",
    "cryptography==42.0.8",
    "chromadb==0.4.24",
    "sentence-transformers==2.3.0",
    "transformers==4.39.3",
    "tokenizers==0.15.2",
    "openai==1.12.0",
    "httpx==0.27.2",
    "aiofiles==23.2.0",
    "pyyaml==6.0.1",
    "requests==2.31.0",
    "numpy==1.26.0",
    "pandas==2.2.0",
    "openpyxl==3.1.2",
    "python-dateutil==2.8.2",
    "tiktoken==0.6.0",
    "torch==2.2.2",
]

# 注意：httpx 已固定 0.27.2（openai 1.12 与 httpx>=0.28 不兼容，升级前必须验证）
# 注意：未使用的 langchain/langchain-community 已从依赖中移除（代码未引用）

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Agent 2.0 阶段（P3）引入，避免当前基础安装膨胀
agent = [
    "langchain-core>=0.2,<0.4",
    "langgraph>=0.2",
    "mcp>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
